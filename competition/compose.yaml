services:
  selftest:
    build: .
    image: powercontext-competition-selftest:2026
    user: "0"
    network_mode: none
    cpus: 1
    mem_limit: 2g
    pids_limit: 512
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    environment:
      POWERCONTEXT_CANDIDATE: /candidate
      POWERCONTEXT_PUBLIC: /selftest
      PYTHONPATH: /candidate/src:/selftest
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TZ: UTC
    volumes:
      - type: bind
        source: ${POWERCONTEXT_CANDIDATE:-..}/src
        target: /candidate/src
        read_only: true
      - type: bind
        source: .
        target: /selftest
        read_only: true
