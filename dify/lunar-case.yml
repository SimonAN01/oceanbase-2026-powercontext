app:
  name: 月球失物局
  description: 在月面温室调查三份线索，找回失踪的第一棵生菜。
  icon: 🌙
  icon_background: '#E0EAFF'
  mode: workflow
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables:
  - id: e2dfb2ff-0c68-54d3-a80d-dcc5398a5224
    name: GAME_URL
    value: http://lunar-case-game:4317
    value_type: string
    description: Dify SSRF 代理可访问的失物局服务地址，末尾不加斜杠。
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
  graph:
    nodes:
    - data:
        type: start
        title: 选择档案与行动
        desc: ''
        selected: false
        variables:
        - label: 档案号（8 至 40 位字母、数字、短横线或下划线）
          variable: ticket
          max_length: 40
          options: []
          required: true
          type: text-input
        - label: 行动
          variable: action
          max_length: 48
          options:
          - 开始或继续
          - 调查：温室
          - 调查：维修间
          - 调查：广播室
          - 指认：扫地机
          - 指认：运货机
          - 指认：冰柜机
          required: true
          type: select
      id: '1794045100000'
      type: custom
      position:
        x: 40
        y: 160
      positionAbsolute:
        x: 40
        y: 160
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 88
    - data:
        type: template-transform
        title: 组装本轮请求
        desc: ''
        selected: false
        variables:
        - variable: ticket
          value_selector:
          - '1794045100000'
          - ticket
        - variable: action
          value_selector:
          - '1794045100000'
          - action
        template: '{{ {"ticket": ticket, "action": action} | tojson }}'
      id: '1794045100001'
      type: custom
      position:
        x: 340
        y: 160
      positionAbsolute:
        x: 340
        y: 160
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 88
    - data:
        type: http-request
        title: 读取线索与写入进度
        desc: ''
        selected: false
        method: post
        url: '{{#env.GAME_URL#}}/turn'
        authorization:
          type: no-auth
          config: null
        headers: Content-Type:application/json
        params: ''
        body:
          type: json
          data:
          - key: ''
            type: text
            value: '{{#1794045100001.output#}}'
        timeout:
          connect: 5
          read: 10
          write: 5
        retry_config:
          retry_enabled: false
          max_retries: 0
          retry_interval: 1000
        ssl_verify: true
      id: '1794045100002'
      type: custom
      position:
        x: 640
        y: 160
      positionAbsolute:
        x: 640
        y: 160
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 88
    - data:
        type: end
        title: 展示调查手记
        desc: ''
        selected: false
        outputs:
        - variable: journal
          value_selector:
          - '1794045100002'
          - body
          value_type: string
      id: '1794045100003'
      type: custom
      position:
        x: 940
        y: 160
      positionAbsolute:
        x: 940
        y: 160
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 88
    edges:
    - id: 1794045100000-source-1794045100001-target
      data:
        sourceType: start
        targetType: template-transform
        isInLoop: false
        isInIteration: false
      source: '1794045100000'
      target: '1794045100001'
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
    - id: 1794045100001-source-1794045100002-target
      data:
        sourceType: template-transform
        targetType: http-request
        isInLoop: false
        isInIteration: false
      source: '1794045100001'
      target: '1794045100002'
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
    - id: 1794045100002-source-1794045100003-target
      data:
        sourceType: http-request
        targetType: end
        isInLoop: false
        isInIteration: false
      source: '1794045100002'
      target: '1794045100003'
      sourceHandle: source
      targetHandle: target
      type: custom
      zIndex: 0
    viewport:
      x: 0
      y: 0
      zoom: 0.9
